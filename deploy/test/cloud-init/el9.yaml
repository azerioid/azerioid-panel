#cloud-config
# Stack Manager P1 smoke — EL 9 (SELinux enforcing)
package_update: true
packages:
  - git
  - curl
  - ca-certificates
  - python3
  - openssl
  - rsync
  - sudo
  - systemd
  - policycoreutils-python-utils
  - sqlite
runcmd:
  - setenforce 1 || true
  - mkdir -p /opt/stack-manager
  - echo "Stack Manager smoke VM ready (EL 9, SELinux enforcing)" > /etc/motd
final_message: "Stack Manager EL 9 test VM ready after $UPTIME seconds"
