# Template. install.sh rewrites `port` to the panel public port.
# Do not bake a host-specific action; inherit banaction from jail.conf
# (iptables or nftables depending on the distro).
[lacmp-panel]
enabled  = true
filter   = lacmp-panel
logpath  = /var/log/lacmp-panel/auth-fail.log
backend  = auto
maxretry = 5
findtime = 600
bantime  = 3600
port     = http,https
