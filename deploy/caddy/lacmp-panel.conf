# LACMP Panel — localhost-only vhost (generated example).
#
# Default install: ./lacmp_gui.sh  (listens on 127.0.0.1:3169 unless --port=NNNN)
# Access: ssh -L 3169:127.0.0.1:3169 <host>  then  http://127.0.0.1:3169
# Replace 3169 with your --port if you changed it.
#
# Bind is 127.0.0.1 only. Public HTTPS is a separate site block (see
# lacmp-panel.public-ip.conf.example / lacmp-panel.public-domain.conf.example).

http://127.0.0.1:3169 {
    bind 127.0.0.1
    encode gzip zstd
    root * /usr/local/lib/lacmp-panel/web/public
    php_fastcgi unix//run/php/lacmp-panel.sock
    file_server
    header {
        X-Content-Type-Options nosniff
        X-Frame-Options DENY
        Referrer-Policy no-referrer
        -Server
    }
    log {
        output file /var/log/caddy/access_lacmp-panel.log {
            roll_size 16mb
            roll_keep 3
            roll_keep_for 7d
        }
    }
}
